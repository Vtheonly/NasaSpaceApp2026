# Harmonization pipeline configuration (defaults mirror src/common/config.py).
# Split boundaries follow docs/TESTING.md pass 3 (proposed starting split).
seed: 2026
frp_units: "MW"
extreme_frp_review_threshold_mw: 5000.0

split:
  train_end: "2021-12-31"
  validation_end: "2023-12-31"

matching:
  temporal_tolerance_minutes: 90
  min_footprint_radius_deg: 0.01
  max_footprint_radius_deg: 0.25
  default_footprint_radius_deg: 0.02
  min_confidence: "l"
  deduplicate_modis: true

model:
  tweedie_variance_power: 1.5
  n_estimators: 2000          # chronological early stopping picks the used count
  learning_rate: 0.03
  num_leaves: 15
  min_child_samples: 40
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 5.0
  early_stopping_rounds: 50
  early_stopping_days: 365
