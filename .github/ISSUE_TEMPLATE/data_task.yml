name: Data task (FIRMS / HLS)
description: Ingestion, inventory, validation, licensing, or data-quality work (five-pass gate, fixtures, real archives)
labels: ["workstream: data", "P1"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Which product/archive is affected (FIRMS MODIS C6.x, VIIRS S-NPP 375 m, optional HLS)? Which gate pass or contract is involved?
      placeholder: "e.g. Real FIRMS export fails gate pass 2 with frp_nonfinite on NPP rows..."
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: Concrete, checkable steps.
      placeholder: "- [ ] ...\n- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / blocked-by
      description: Issues or modules this depends on, and what depends on it.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Measurable conditions for "done" (include contract/test names where possible).
      placeholder: "e.g. gate reports quarantine reason X with counts; tests/unit/test_gate.py covers it"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Required evidence
      description: Which artifact/test output proves completion (report path, test file, manifest fields)?
  - type: dropdown
    id: requirement
    attributes:
      label: Linked requirement
      description: docs/CHALLENGE_AND_REQUIREMENTS.md requirement ID if applicable.
      options:
        - R-01 AOI selection
        - R-03 sensor harmonization
        - R-04 continuous record
        - R-07 unusual conditions
        - R-08 critical periods
        - R-10 provenance/labels
        - R-12 offline behavior
        - R-14 reproducibility
        - Not requirement-linked
